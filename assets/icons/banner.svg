      <path d="M 44 140 Q 116 74 214 116 Q 128 176 44 140 Z"
            fill="none" stroke="#ffffff" stroke-width="13" stroke-linejoin="miter" miterlimit="6"/>
      <circle cx="124" cy="130" r="18" fill="none" stroke="#ffffff" stroke-width="11"/>
    </g>
  </g>

  <!-- 文字标志 -->
  <text x="550" y="200" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif"
