<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 384" width="1024" height="384">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b45e0"/>
      <stop offset="100%" stop-color="#1e63e9"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="384" fill="#ffffff"/>

  <!-- 图形标志 -->
  <g transform="translate(290, 92) scale(0.78125)">
    <rect width="256" height="256" rx="56" ry="56" fill="url(#tile)"/>
    <g transform="rotate(-7 128 128)">
      <line x1="204" y1="112" x2="243" y2="70"
