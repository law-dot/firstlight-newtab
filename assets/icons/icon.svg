<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b45e0"/>
      <stop offset="100%" stop-color="#1e63e9"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" ry="56" fill="url(#tile)"/>

  <g transform="rotate(-7 128 128)">
    <!-- 把手 -->
    <line x1="204" y1="112" x2="243" y2="70"
          stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>

    <!-- 斜挑眼形：左眼角低、右眼角高，上下弧不为镜像 -->
    <path d="M 44 140 Q 116 74 214 116 Q 128 176 44 140 Z"
          fill="none" stroke="#ffffff" stroke-width="13" stroke-linejoin="miter" miterlimit="6"/>

    <!-- 虹膜：空心环 -->
    <circle cx="124" cy="130" r="18" fill="none" stroke="#ffffff" stroke-width="11"/>
  </g>
</svg>
