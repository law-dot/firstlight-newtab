<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>1.3.4 壁纸题材 · 分类自检</title>
<style>
  body { margin: 0; padding: 28px 30px 60px; background: #f4f6fa; color: #1c2230;
         font: 14px/1.7 -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: #5b6474; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; max-width: 1080px; background: #fff;
          box-shadow: 0 1px 3px rgba(20,30,50,.08); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #eceff4; font-size: 13px; vertical-align: top; }
  th { background: #f7f9fc; font-weight: 600; color: #465063; }
  td.g { white-space: nowrap; font-weight: 600; }
  .g2 { color: #167a4a; } .g1 { color: #8a6d1f; } .g0 { color: #a33a3a; }
  #out { max-width: 1080px; margin: 20px 0 0; padding: 14px 16px; border-radius: 10px;
         background: #10151f; color: #d6e2f5; font: 12px/1.8 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; }
  .ok { color: #6ee7a8; } .bad { color: #ff8b8b; }
</style>
</head>
<body>
<h1>1.3.4 壁纸题材 · 分类自检</h1>
<p class="lead">样本是 Bing 每日图近 15 天的真实文案（2026-10-25 ~ 11-08），逐条跑线上分类器。绿=自然，黄=说不清，红=人造。</p>
<table id="tbl">
  <thead><tr><th style="width:66px">日期</th><th style="width:150px">标题</th><th>版权文案</th><th style="width:86px">判定</th><th style="width:56px">期望</th></tr></thead>
  <tbody></tbody>
</table>
<pre id="out">loading…</pre>

<script type="module">
/* 只用分类器，不碰网络：把线上函数原样 import 过来，不抄一份。 */
import { natureGroup, pickNature } from '../js/features/wallpaper.js';

const SAMPLES = [
  ['20261108', '艺术与韵律交汇之地', '特里亚纳历史街区，塞维利亚，西班牙 (© Andrzej Rostek/Getty Images)', 0],
  ['20261107', '光芒四射的节日', '排灯节灯笼，孟买，马哈拉施特拉邦，印度 (© Dinodia Photo/Getty Images)', 0],
  ['20261106', '归来的草原巨兽', '草原上的一头野牛，西奥多·罗斯福国家公园，北达科他州，美国 (© Tandem Stock/Adobe Stock)', 2],
  ['20261105', '穿越毛伊岛的绿色隧道', '竹林，皮皮维小径，哈莱亚卡拉国家公园，毛伊岛，夏威夷州，美国 (© MNStudio/Getty Images)', 2],
  ['20261104', '向山巅再迈一步', '石墙边的木制翻越梯，黑岩，湖区，英格兰 (© Alex Treadway/Getty Images)', 2],
  ['20261103', '泛舟如画秋林', '五彩落羽杉间划船的人们，宣城，安徽省，中国 (© Jackal Pan/Getty Images)', 2],
  ['20261102', '群峰间的宁静', '布莱埃斯湖，法内斯-塞内斯-布莱埃斯湖自然公园，多洛米蒂山脉，意大利 (© leonid_tit/Getty Images)', 2],
  ['20261101', '写在冰上的未来', '北极熊和幼崽，哈得孙湾畔，马尼托巴省，加拿大 (© Danita Delimont/Adobe Stock)', 2],
  ['20261031', '林间迷雾', '黑森林，巴登-符腾堡州，德国 (© Britus/Getty Images)', 2],
  ['20261030', '往昔帝国的幽影', '圣巴尔多禄茂教堂，法兰克福，德国 (© AlxeyPnferov/Getty Images)', 0],
  ['20261029', '展翅高飞的时节', '沙丘鹤，博斯克德尔阿帕奇国家野生动物保护区，新墨西哥州，美国 (© Terry St.Louis/Getty Images)', 2],
  ['20261028', '薄雾邂逅千年时光', '立石，埃夫伯里，威尔特郡，英格兰 (© George W Johnson/Getty Images)', 0],
  ['20261027', '历史守望之地', '库涅季采山城堡，波希米亚，捷克 (© Marek Saroch/Alamy)', 0],
  ['20261026', '大自然的金色明镜', '秋叶缤纷的池杉林，乔治亚州，美国 (© Chris Moore/Getty Images)', 2],
  ['20261025', '大自然的秋日乐章', '秋日瀑布，西托沃附近，普罗夫迪夫州，保加利亚 (© Nadya85/Getty Images)', 2]
];

const NAME = { 2: '自然', 1: '说不清', 0: '人造' };
const tbody = document.querySelector('#tbl tbody');
const list = SAMPLES.map(([date, title, credit, want]) => ({ date, title, credit, want, img: { title, credit } }));
for (const row of list) {
  row.got = natureGroup(row.img);
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${row.date}</td><td>${row.title}</td><td>${row.credit}</td>
    <td class="g g${row.got}">${NAME[row.got]}</td><td>${NAME[row.want]}</td>`;
  tbody.appendChild(tr);
}

/* ---------- 断言 ---------- */
const out = [];
const ok = (name, cond, extra = '') => out.push([cond, name, extra]);

const naturals = list.filter((r) => r.want === 2);
const humans = list.filter((r) => r.want === 0);
const hitN = naturals.filter((r) => r.got === 2).length;
const hitH = humans.filter((r) => r.got === 0).length;

ok('[1] 自然样本至少 9/10 判对', hitN >= 9, `${hitN}/${naturals.length}`);
ok('[2] 人造样本 5/5 判对', hitH === humans.length, `${hitH}/${humans.length}`);
ok('[3] 边界样本「石墙 + 湖区」仍算自然', list.find((r) => r.date === '20261104').got === 2);

const imgs = list.map((r) => r.img);
const picked = pickNature(imgs);
const pickedG = picked.map((i) => natureGroup(i));
ok('[4] 自然图够数时剔除人造', !pickedG.includes(0), `剩 ${picked.length} 张 / ${imgs.length}`);
ok('[5] 剔除后的首张是自然图', pickedG[0] === 2);
ok('[6] 顺序为「自然 → 说不清 → 人造」',
   pickedG.every((g, i) => i === 0 || pickedG[i - 1] >= g), pickedG.join(''));

// 自然图不足 4 张时不该把人造图丢掉（宁可混一张，也不能只剩空白或一两张）
const thin = imgs.filter((i) => natureGroup(i) === 0).slice(0, 5)
  .concat(imgs.filter((i) => natureGroup(i) === 2).slice(0, 2));
const thinPicked = pickNature(thin);
ok('[7] 自然图不足 4 张时保留全部（只调顺序）', thinPicked.length === thin.length,
   `${thinPicked.length}/${thin.length}`);
ok('[8] 这种情况下自然图仍排在最前', natureGroup(thinPicked[0]) === 2);

ok('[9] 空列表不炸', Array.isArray(pickNature([])) && pickNature([]).length === 0);
ok('[10] null 也不炸', Array.isArray(pickNature(null)) && pickNature(null).length === 0);

const pass = out.filter(([c]) => c).length;
document.querySelector('#out').innerHTML = out
  .map(([c, n, e]) => `<span class="${c ? 'ok' : 'bad'}">${c ? '✓' : '✗'} ${n}</span>${e ? '  → ' + e : ''}`)
  .join('\n') + `\n\n${pass}/${out.length} 通过`;
document.title = `1.3.4 自检 ${pass}/${out.length}`;
</script>
</body>
</html>
