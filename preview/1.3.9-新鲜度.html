<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>1.3.9 新鲜度链路 · 自检</title>
<style>
  body { font: 13px/1.7 -apple-system, sans-serif; margin: 24px; max-width: 760px; }
  h1 { font-size: 16px; }
  pre { background: #f6f6f4; border: 1px solid #ddd; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
  .ok { color: #0a7d4f; }
  .bad { color: #c23434; font-weight: 500; }
</style>
</head>
<body>
<h1>1.3.9 新鲜度链路 · 自检</h1>
<p>预览环境无 chrome.storage（store.js 回退 localStorage）。真实广播监听无法在 file:// 下触发，
这里验证纯逻辑层：回声判定、外部判定、拉取合入、墓碑回归。真机验证步骤见交付说明。</p>
<pre id="out">运行中…</pre>
<script type="module">
const out = [];
const ok = (name, cond, extra = '') => out.push([!!cond, name, extra]);

try {
  const {
    externalLocalKeys, loadData, saveData, loadUnits, loadSections,
    GROUP_INDEX_KEY, GROUP_PREFIX, SITE_TOMBS_KEY, unitKeyOf
  } = await import('../js/core/store.js');
  const { pullMerge, backgroundPull } = await import('../js/core/sync.js');

  /* ---------- 环境预置 ---------- */
  const data = await loadData();
  ok('[1] 环境预置 loadData', Array.isArray(data.groups) && data.groups.length > 0,
     `groups=${data.groups.length}`);

  // 写一次真实变更：settings 改一个字段（saveData 只写变化的键）
  data.settings.engine = 'bing';
  await saveData(data);

  /* ---------- ① 回声判定：自己写的必须判自写 ---------- */
  const units = await loadUnits();
  const echo = {};
  for (const k of Object.keys(units)) echo[k] = { newValue: units[k] };
  const r1 = externalLocalKeys(echo);
  ok('[2] 本页刚写的全部记录判为回声（不触发重载）', r1.length === 0, r1.join(','));

  /* ---------- ② 外部判定：别的窗口写的必须认出来 ---------- */
  const sk = unitKeyOf('settings');
  const rec = units[sk];
  echo[sk] = { newValue: { ...rec, v: { ...rec.v, engine: 'tav' } } };
  ok('[3] 别的窗口改设置 → external', externalLocalKeys(echo).includes(sk));
  echo[sk] = { newValue: rec };

  const g = data.groups[0];
  const gk = `${GROUP_PREFIX}${g.id}.v1`;
  echo[gk] = { newValue: { v: { ...g, title: '别的窗口改的' }, updatedAt: 999 } };
  ok('[4] 别的窗口改分组 → external', externalLocalKeys(echo).includes(gk));
  echo[gk] = { newValue: units[gk] };

  // 全部还原后重新判一遍：应当一个 external 都没有（防上面的测试污染）
  ok('[5] 还原后重新判定：全回声', externalLocalKeys(echo).length === 0);

  /* ---------- ③ 删除事件与旁路键 ---------- */
  ok('[6] 记录被删（newValue 缺席）→ external',
     externalLocalKeys({ [gk]: { oldValue: { v: g } } }).includes(gk));
  ok('[7] feedcache 旁路写入不触发重载',
     externalLocalKeys({ 'monk.feedcache.v1': { newValue: { v: { x: 1 } } } }).length === 0);
  ok('[8] 无关键不触发',
     externalLocalKeys({ 'some.other.key': { newValue: 1 } }).length === 0);

  /* ---------- ④ 拉取合入（freshness 链路的下游：数据要能看到） ---------- */
  const cloud = {};
  cloud[sk] = { v: { ...data.settings, engine: 'bing' }, updatedAt: 500 };
  cloud[GROUP_INDEX_KEY] = { v: [g.id], d: {}, updatedAt: 500 };
  cloud[gk] = { v: { ...g, title: '云端改的标题' }, updatedAt: 500 };
  const res = await pullMerge(cloud);
  const secs = await loadSections();
  ok('[9] pullMerge 报告拉到了更新', res.pulled === true);
  ok('[10] 拉到的分组标题已可见（reload 路径有效）',
     secs.groups.v.find((x) => x.id === g.id)?.title === '云端改的标题');

  /* ---------- ⑤ 墓碑回归（1.3.8 的行为不能被打破） ---------- */
  const victim = g.sites[0];
  if (victim) {
    const cloud2 = {};
    cloud2[SITE_TOMBS_KEY] = { v: { [victim.id]: Date.now() }, updatedAt: Date.now() };
    const res2 = await pullMerge(cloud2);
    const dbg = await loadUnits();
    const secs2 = await loadSections();
    const g2 = secs2.groups.v.find((x) => x.id === g.id);
    ok('[11] 云端墓碑仍生效：被删卡从视图消失',
       g2 && !g2.sites.some((s) => s.id === victim.id),
       `pulled=${res2.pulled} tombs=${JSON.stringify(dbg[SITE_TOMBS_KEY] || null)} victim=${victim.id} sites=${g2 ? g2.sites.length : 'nogroup'}`);
  } else {
    ok('[11] 墓碑回归跳过（默认分组没有站点）', true);
  }

  /* ---------- ⑥ backgroundPull 在预览环境安全 no-op ---------- */
  await backgroundPull();
  ok('[12] backgroundPull 无 chrome.storage 时不抛错', true);
} catch (err) {
  out.push([false, '自检页异常', String(err && err.stack || err)]);
}

const pass = out.filter(([c]) => c).length;
const lines = out.map(
  ([c, name, extra]) => `${c ? '✓' : '✗'} ${name}${extra ? ` · ${extra}` : ''}`
);
lines.push('');
lines.push(`${pass}/${out.length} 通过`);
document.getElementById('out').textContent = lines.join('\n');
document.title = `${pass}/${out.length} · 1.3.9 自检`;
</script>
</body>
</html>
