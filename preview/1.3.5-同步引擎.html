<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>1.3.5 同步 · pullMerge 自检</title>
<style>
  body { margin: 0; padding: 28px 30px 60px; background: #f4f6fa; color: #1c2230;
         font: 14px/1.7 -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.lead { margin: 0 0 20px; color: #5b6474; font-size: 13px; }
  #out { max-width: 1080px; margin: 8px 0 0; padding: 14px 16px; border-radius: 10px;
         background: #10151f; color: #d6e2f5; font: 12px/1.8 ui-monospace, Menlo, monospace;
         white-space: pre-wrap; }
  .ok { color: #6ee7a8; } .bad { color: #ff8b8b; }
</style>
</head>
<body>
<h1>1.3.5 同步 · pullMerge / 状态面板 自检</h1>
<p class="lead">跑线上 sync.js 的合并引擎（预览环境 store.js 自动退回 localStorage）。覆盖：新者胜、回声抑制、索引并集、墓碑删除、状态汇总、WebDAV 参数校验。</p>
<pre id="out">loading…</pre>

<script type="module">
import { pullMerge, getSyncStatus, testWebdav, davErrText, initSync } from '../js/core/sync.js';
import { saveUnit, loadUnits, GROUP_INDEX_KEY, GROUP_PREFIX } from '../js/core/store.js';

const out = [];
const ok = (name, cond, extra = '') => out.push([!!cond, name, extra]);

/* 清掉预览环境的 monk.* 键，从头种数据 */
for (const k of Object.keys(localStorage)) {
  if (k.startsWith('monk.')) localStorage.removeItem(k);
}

const g1 = { id: 'g1', name: '常用', sites: [{ id: 's1', title: '知乎', url: 'https://www.zhihu.com', icon: '' }] };
const g2 = { id: 'g2', name: '工作', sites: [{ id: 's2', title: 'GitHub', url: 'https://github.com', icon: '' }, { id: 's3', title: '语雀', url: 'https://www.yuque.com', icon: '' }] };
const g3 = { id: 'g3', name: '娱乐', sites: [] };

async function seed(index, groups, extras = {}) {
  localStorage.clear();
  for (const k of Object.keys(localStorage)) if (k.startsWith('monk.')) localStorage.removeItem(k);
  await saveUnit(GROUP_INDEX_KEY, index);
  for (const g of groups) await saveUnit(`${GROUP_PREFIX}${g.id}.v1`, { v: g, updatedAt: index.updatedAt });
  for (const [k, rec] of Object.entries(extras)) await saveUnit(k, rec);
}

const SET = 'monk.settings.v1';
const TODOS = 'monk.todos.v1';

/* ---------- ① 新者胜：远端新 → 落盘；本机新 → toPush；相等 → 回声 ---------- */
await seed({ v: ['g1'], d: {}, updatedAt: 100 }, [g1], {
  [SET]: { v: { engine: 'baidu' }, updatedAt: 100 },
  [TODOS]: { v: [{ id: 't1', text: '本机较新', done: false, date: '' }], updatedAt: 50 }
});
const remote1 = {
  [SET]: { v: { engine: 'bing' }, updatedAt: 200 },                       // 远端新
  [TODOS]: { v: [{ id: 't0', text: '远端较旧', done: false, date: '' }], updatedAt: 30 }, // 本机新
  [`${GROUP_PREFIX}g1.v1`]: { v: g1, updatedAt: 100 }                     // 回声
};
const r1 = await pullMerge(remote1);
const after1 = await loadUnits();
ok('[1] 远端较新的设置落盘且 pulled=true',
   r1.pulled === true && after1[SET].updatedAt === 200 && after1[SET].v.engine === 'bing');
ok('[2] 本机较新的待办进了 toPush 且未被覆盖',
   !!r1.toPush[TODOS] && after1[TODOS].v[0].text === '本机较新');
ok('[3] updatedAt 相等是回声：不拉也不推',
   !r1.toPush[`${GROUP_PREFIX}g1.v1`] && after1[`${GROUP_PREFIX}g1.v1`].updatedAt === 100);

/* ---------- ② 索引并集 + 墓碑删除 ---------- */
await seed({ v: ['g1', 'g2'], d: {}, updatedAt: 100 }, [g1, g2], {
  [SET]: { v: {}, updatedAt: 100 }
});
const remote2 = {
  [GROUP_INDEX_KEY]: { v: ['g2', 'g3'], d: { g1: 900 }, updatedAt: 200 }, // g3 是对面新增，g1 被对面删了
  [`${GROUP_PREFIX}g3.v1`]: { v: g3, updatedAt: 200 }
};
const r2 = await pullMerge(remote2);
const after2 = await loadUnits();
const ids2 = after2[GROUP_INDEX_KEY].v;
ok('[4] 索引并集：远端新增 g3 并入、新索引序优先；g1 因墓碑按「删除赢」不保留',
   ids2.join(',') === 'g2,g3', ids2.join(','));
ok('[5] 墓碑里的 g1：本地记录被清掉', !after2[`${GROUP_PREFIX}g1.v1`]);
ok('[6] 墓碑里的组不再进 toPush', !r2.toPush[`${GROUP_PREFIX}g1.v1`]);
ok('[7] 墓碑保留在合并结果里（其他设备才能学到删除）',
   (after2[GROUP_INDEX_KEY].d || {}).g1 === 900);

/* ---------- ③ 状态面板 ---------- */
await seed({ v: ['g1', 'g2'], d: {}, updatedAt: 300 }, [g1, g2], {
  [SET]: { v: {}, updatedAt: 300 },
  [TODOS]: { v: [{ id: 't1', text: 'a', done: false, date: '' }, { id: 't2', text: 'b', done: true, date: '' }], updatedAt: 300 }
});
const st = await getSyncStatus();
ok('[8] 状态面板：本机汇总记录数 = 索引 + 2 组 + 设置 + 待办',
   st.local.records === 5, `got ${st.local.records}`);
ok('[9] 状态面板：分组 2、站点 3、待办 2',
   st.local.groups === 2 && st.local.sites === 3 && st.local.todos === 2,
   `g${st.local.groups}/s${st.local.sites}/t${st.local.todos}`);
ok('[10] 未开启同步时 remote 为 undefined 且无 error', st.mode === 'off' && !st.remote && !st.error);

/* ---------- ④ WebDAV 参数校验 ---------- */
const t1 = await testWebdav({ url: 'abc', username: 'u', password: 'p' });
ok('[11] 非 http(s) 地址被判 badurl', t1.ok === false && t1.reason === 'badurl');
ok('[12] auth 错误提示提到应用密码', davErrText('auth').includes('应用密码'));
ok('[13] network 错误提示提到连不上', davErrText('network').includes('连不上'));

/* ---------- ⑤ 空远端 ---------- */
await seed({ v: ['g1'], d: {}, updatedAt: 100 }, [g1]);
const r3 = await pullMerge({});
ok('[14] 云端全空：不拉（pulled=false），本机数据全进 toPush',
   r3.pulled === false && Object.keys(r3.toPush).length >= 2, `toPush ${Object.keys(r3.toPush).length} 条`);

/* ---------- ⑥ WebDAV 真往返（本机测试服务器；连不上则整段跳过） ---------- */
const DAV = 'http://127.0.0.1:8765/';
let davUp = false;
try {
  const c = await fetch(DAV + 'ping', { method: 'OPTIONS' });
  davUp = c.ok || c.status === 204;
} catch {
  /* 没起服务器 */
}

if (davUp) try {
  // 清空快照目录里的旧文件（必须是合法 JSON，否则 davGet 的 res.json() 会炸）
  await fetch(DAV + 'firstlight-sync.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: '{"app":"firstlight","ver":1,"records":{}}'
  }).catch(() => {});

  await seed({ v: ['g1'], d: {}, updatedAt: 100 }, [g1], {
    [SET]: { v: { engine: 'baidu' }, updatedAt: 100 }
  });
  localStorage.setItem('monk.syncconf.v1',
    JSON.stringify({ mode: 'webdav', webdav: { url: DAV, username: 'u', password: 'p' }, lastSyncAt: 0 }));

  const pulledA = await initSync();
  const snapA = await (await fetch(DAV + 'firstlight-sync.json')).json();
  const localA = await loadUnits();
  ok('[15] 第一轮（云端空）：快照推上去，记录数与本机一致',
     pulledA === false && snapA.app === 'firstlight' &&
     Object.keys(snapA.records).length === Object.keys(localA).length,
     `云端 ${Object.keys(snapA.records).length} / 本机 ${Object.keys(localA).length}`);

  // 模拟另一台设备：推一份「设置更新 + g1 被删」的快照
  snapA.savedAt = Date.now();
  snapA.deviceId = 'other-device';
  snapA.records[SET] = { v: { engine: 'bing' }, updatedAt: 500 };
  snapA.records[GROUP_INDEX_KEY] = { v: ['g1'], d: { g1: 900 }, updatedAt: 500 };
  await fetch(DAV + 'firstlight-sync.json', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(snapA)
  });

  const pulledB = await initSync();
  const afterB = await loadUnits();
  ok('[16] 第二轮：远端更新的设置拉回本机',
     pulledB === true && afterB[SET].v.engine === 'bing' && afterB[SET].updatedAt === 500);
  ok('[17] 快照里的墓碑同样生效：本地 g1 记录被清',
     !afterB[`${GROUP_PREFIX}g1.v1`]);
  ok('[18] 往返后本机配置里记住了 deviceId 和 lastSyncAt',
     (JSON.parse(localStorage.getItem('monk.syncconf.v1')).deviceId || '').startsWith('d'));
} catch (err) {
  out.push([false, '[15-18] WebDAV 往返抛错：' + (err?.message || err)]);
} else {
  out.push([true, '[15-18] WebDAV 真往返：测试服务器未启动，整段跳过（python3 /tmp/davserver.py）']);
}

const pass = out.filter(([c]) => c).length;
document.querySelector('#out').innerHTML = out
  .map(([c, n, e]) => `<span class="${c ? 'ok' : 'bad'}">${c ? '✓' : '✗'} ${n}</span>${e ? '  → ' + e : ''}`)
  .join('\n') + `\n\n${pass}/${out.length} 通过`;
document.title = `1.3.5 自检 ${pass}/${out.length}`;
</script>
</body>
</html>
