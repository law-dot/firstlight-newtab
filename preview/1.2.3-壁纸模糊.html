<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>初见 1.2.3 · 壁纸模糊预览</title>
<style>
  :root {
    --text: #f5f7fa;
    --muted: rgba(245, 247, 250, .62);
    --faint: rgba(245, 247, 250, .36);
    --card: rgba(255, 255, 255, .306);
    --card-hover: rgba(255, 255, 255, .376);
    --stroke: rgba(255, 255, 255, .16);
    --panel: rgba(18, 20, 26, .78);
    --accent: #7c6cf6;
    --shadow: 0 18px 48px rgba(0, 0, 0, .3);
    --ring: rgba(255, 255, 255, .62);
    --letter-bg: rgba(255, 255, 255, .14);

    /* 被调的两个量 */
    --bgblur: 12px;
    --dim: .12;
    --dim-color: #05070c;
  }
  html[data-theme="light"] {
    --text: #1b1f27;
    --muted: rgba(27, 31, 39, .58);
    --faint: rgba(27, 31, 39, .34);
    --card: rgba(255, 255, 255, .808);
    --card-hover: rgba(255, 255, 255, .878);
    --stroke: rgba(0, 0, 0, .08);
    --panel: rgba(250, 251, 254, .9);
    --shadow: 0 18px 48px rgba(20, 26, 40, .16);
    --ring: rgba(0, 0, 0, .42);
    --letter-bg: rgba(0, 0, 0, .09);
    --dim-color: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 壁纸 ============ */
  /* 模糊会把边缘的像素「半透明化」，所以四边要外扩，否则出现一圈发虚的白边 */
  .bg {
    position: fixed;
    inset: calc(var(--bgblur) * -2.4);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000'%3E%3Cdefs%3E%3ClinearGradient id='sky' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%230c1734'/%3E%3Cstop offset='.42' stop-color='%233d3466'/%3E%3Cstop offset='.72' stop-color='%23b4635a'/%3E%3Cstop offset='1' stop-color='%23f2a86c'/%3E%3C/linearGradient%3E%3ClinearGradient id='water' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23c78a6c'/%3E%3Cstop offset='.35' stop-color='%235a4a6e'/%3E%3Cstop offset='1' stop-color='%23191a2c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1600' height='640' fill='url(%23sky)'/%3E%3Ccircle cx='1150' cy='470' r='74' fill='%23ffdcaa' opacity='.95'/%3E%3Cellipse cx='330' cy='210' rx='230' ry='52' fill='%23e0c9d8' opacity='.28'/%3E%3Cellipse cx='520' cy='250' rx='180' ry='38' fill='%23f0d7d2' opacity='.22'/%3E%3Cellipse cx='860' cy='150' rx='260' ry='44' fill='%23c9b6d8' opacity='.2'/%3E%3Cpath d='M0 640 L210 356 L360 520 L540 300 L760 640 Z' fill='%232b2542'/%3E%3Cpath d='M420 640 L640 392 L800 520 L980 340 L1240 640 Z' fill='%23221e37'/%3E%3Cpath d='M1080 640 L1290 430 L1420 540 L1600 420 L1600 640 Z' fill='%231b1830'/%3E%3Crect y='640' width='1600' height='360' fill='url(%23water)'/%3E%3Cpath d='M900 700 Q1050 690 1250 706 L1250 720 Q1050 704 900 714 Z' fill='%23ffcaa6' opacity='.5'/%3E%3Cpath d='M860 760 Q1030 750 1240 766 L1240 776 Q1030 760 860 770 Z' fill='%23ffcaa6' opacity='.32'/%3E%3Cpath d='M820 820 Q1000 812 1220 826 L1220 834 Q1000 820 820 828 Z' fill='%23ffcaa6' opacity='.2'/%3E%3Cpath d='M120 1000 L150 700 L180 1000 Z' fill='%2312101f'/%3E%3Cpath d='M210 1000 L235 760 L262 1000 Z' fill='%23161426'/%3E%3Cpath d='M1420 1000 L1450 720 L1480 1000 Z' fill='%2312101f'/%3E%3C/svg%3E");
    background-size: cover;
    background-position: center;
    filter: blur(var(--bgblur)) saturate(105%);
    z-index: 0;
    pointer-events: none;
  }
  /* ============ 遮罩（当前 1.2.2 的机制） ============ */
  .dim {
    position: fixed; inset: 0;
    background: var(--dim-color);
    opacity: var(--dim);
    z-index: 1;
    pointer-events: none;
  }

  /* ============ 页面 ============ */
  main {
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 32px 68px;
    gap: 26px;
  }
  .clock { font-size: 76px; font-weight: 250; letter-spacing: -2px; line-height: 1; }
  .date { margin-top: -14px; font-size: 13px; color: var(--muted); letter-spacing: .5px; }

  .search {
    width: min(620px, 82vw);
    display: flex; align-items: center; gap: 12px;
    padding: 13px 18px;
    border-radius: 15px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, .16);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .16);
    color: var(--faint);
    font-size: 13.5px;
  }
  .search .k {
    margin-left: auto; font-size: 10.5px; padding: 2px 6px; border-radius: 5px;
    border: 1px solid var(--stroke); color: var(--faint);
  }

  .grid {
    width: min(1080px, 92vw);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
    margin-top: 8px;
  }
  .card {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; min-height: 64px; min-width: 0;
    border-radius: 15px;
    background: var(--card);
    border: 1px solid transparent;
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    transition: background .16s ease, transform .16s ease;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .ico {
    width: 48px; height: 48px; flex: none; border-radius: 13px;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 600; color: #fff;
    background: var(--letter-bg);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
  }
  .name {
    flex: 1; min-width: 0; text-align: center;
    font-size: 12.5px; font-weight: 500; line-height: 1.3; opacity: .95;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere;
  }

  .dock {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 3;
    display: flex; gap: 8px; padding: 9px 12px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, .14);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
  }
  .dock i {
    width: 30px; height: 30px; border-radius: 9px;
    background: rgba(255, 255, 255, .16);
    display: block;
  }

  /* ============ 控制面板 ============ */
  .panel {
    position: fixed; right: 18px; bottom: 18px; z-index: 9;
    width: 306px; padding: 14px 16px 16px;
    border-radius: 15px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    font-size: 12px;
  }
  .panel h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600;
    letter-spacing: .3px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .panel h3 button {
    margin-left: auto; padding: 2px 8px; font-size: 11px; font-family: inherit;
    color: var(--muted); background: rgba(255, 255, 255, .08);
    border: 1px solid var(--stroke); border-radius: 6px; cursor: pointer;
  }
  .row { margin-bottom: 12px; }
  .row > label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px; color: var(--faint); font-size: 11px;
  }
  .row > label b { color: var(--text); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button {
    flex: 1; padding: 5px 4px; font-size: 11.5px; font-family: inherit;
    color: var(--muted); background: rgba(255, 255, 255, .07);
    border: 1px solid transparent; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  html[data-theme="light"] .seg button { background: rgba(0, 0, 0, .045); }
  .seg button:hover { color: var(--text); }
  .seg button.on { color: #fff; background: var(--accent); }
  .mini { display: flex; gap: 6px; margin-top: -4px; }
  .mini button {
    flex: 1; padding: 5px; font-size: 11px; font-family: inherit; cursor: pointer;
    color: var(--muted); background: transparent; border: 1px solid var(--stroke); border-radius: 7px;
  }
  .mini button:hover { color: var(--text); border-color: var(--muted); }
  .params {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; line-height: 1.65; color: var(--text);
    background: rgba(0, 0, 0, .26); border: 1px solid var(--stroke);
    word-break: break-all;
  }
  html[data-theme="light"] .params { background: rgba(0, 0, 0, .05); }
  .panel.collapsed .body { display: none; }

  .hintline { margin: 8px 0 0; font-size: 11px; line-height: 1.6; color: var(--faint); }
</style>
</head>
<body>

<div class="bg" id="bg"></div>
<div class="dim" id="dim"></div>

<main>
  <div class="clock">16:08</div>
  <div class="date">11 月 3 日 · 星期二</div>

  <div class="search">
    <span>搜索或输入网址</span>
    <span class="k">⌘K</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="dock"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div class="panel" id="panel">
  <h3>壁纸模糊 · 调参 <button id="fold" type="button">收起</button></h3>
  <div class="body">
    <div class="row">
      <label>模糊程度 <b id="blurVal">12px</b></label>
      <input id="blur" type="range" min="0" max="48" step="1" value="12">
    </div>

    <div class="row">
      <label>遮罩（压暗 / 压亮）<b id="dimVal">12%</b></label>
      <input id="dimRange" type="range" min="0" max="40" step="1" value="12">
      <div class="mini">
        <button data-dim="0">无</button>
        <button data-dim="12">轻 12%</button>
        <button data-dim="30">旧默认 30%</button>
      </div>
    </div>

    <div class="row">
      <label>主题</label>
      <div class="seg" id="segTheme">
        <button data-theme="dark" class="on">深色</button>
        <button data-theme="light">浅色</button>
      </div>
    </div>

    <div class="row">
      <label>壁纸</label>
      <div class="seg" id="segWall">
        <button data-wall="scene" class="on">内置山景</button>
        <button data-wall="bright">明亮浅色</button>
        <button data-wall="gray">纯色深灰</button>
      </div>
      <div class="mini" style="margin-top:6px">
        <button id="pick">用我自己的壁纸…</button>
      </div>
      <input id="file" type="file" accept="image/*" hidden>
    </div>

    <div class="mini" style="margin-top:10px">
      <button id="reset122">还原 1.2.2 默认</button>
      <button id="recommend">推荐值</button>
    </div>

    <div class="params" id="params">模糊 12px · 遮罩 12% · 深色</div>
    <p class="hintline">模糊对壁纸整体生效，卡片和搜索框的毛玻璃叠在模糊层之上；模糊越大，卡片越像一层柔光板。</p>
  </div>
</div>

<script>
const root = document.documentElement;
const $ = (s) => document.querySelector(s);
const state = { blur: 12, dim: 12, theme: 'dark', wall: 'scene' };

const WALLS = {
  scene: null,
  bright: "linear-gradient(160deg,#f7f9fc 0%,#dfe8f6 42%,#f2e6dc 74%,#cfd9ea 100%)",
  gray: "linear-gradient(160deg,#24262c 0%,#17191e 60%,#111318 100%)"
};

const SITES = [
  ['GitHub', 'G'], ['X', 'X'], ['Notion', 'N'], ['Figma', 'F'],
  ['掘金', '掘'], ['知乎', '知'], ['B 站', 'B'], ['腾讯云开发者社区', '腾']
];

function paintCards() {
  const hues = [255, 190, 12, 330, 155, 205, 45, 285];
  $('#grid').innerHTML = SITES.map(([n, c], i) => `
    <div class="card">
      <div class="ico" style="background:hsl(${hues[i]} 64% 48%)">${c}</div>
      <div class="name">${n}</div>
    </div>`).join('');
}

function apply() {
  root.style.setProperty('--bgblur', state.blur + 'px');
  root.style.setProperty('--dim', (state.dim / 100).toFixed(2));
  root.dataset.theme = state.theme;
  $('#blurVal').textContent = state.blur + 'px';
  $('#dimVal').textContent = state.dim + '%';
  $('#blur').value = state.blur;
  $('#dimRange').value = state.dim;
  document.querySelectorAll('#segTheme button').forEach((b) => b.classList.toggle('on', b.dataset.theme === state.theme));
  document.querySelectorAll('#segWall button').forEach((b) => b.classList.toggle('on', b.dataset.wall === state.wall));
  const bg = $('#bg');
  const w = WALLS[state.wall];
  if (w) { bg.style.backgroundImage = w; document.body.dataset.photo = '0'; }
  else if (state.wall === 'scene') { bg.style.backgroundImage = ''; document.body.dataset.photo = '0'; }
  $('#params').textContent =
    `模糊 ${state.blur}px · 遮罩 ${state.dim}% · ${state.theme === 'dark' ? '深色' : '浅色'}`;
}

$('#blur').addEventListener('input', (e) => { state.blur = +e.target.value; apply(); });
$('#dimRange').addEventListener('input', (e) => { state.dim = +e.target.value; apply(); });
document.querySelectorAll('[data-dim]').forEach((b) => b.addEventListener('click', () => { state.dim = +b.dataset.dim; apply(); }));
document.querySelectorAll('#segTheme button').forEach((b) => b.addEventListener('click', () => { state.theme = b.dataset.theme; apply(); }));
document.querySelectorAll('#segWall button').forEach((b) => b.addEventListener('click', () => {
  state.wall = b.dataset.wall;
  document.body.dataset.photo = '0';
  $('#bg').style.backgroundImage = WALLS[state.wall] || '';
  apply();
}));

// 用自己的壁纸看真实效果（在线壁纸、照片细节最能看出模糊差别）
let objUrl = null;
$('#pick').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(f);
  $('#bg').style.backgroundImage = `url("${objUrl}")`;
  document.body.dataset.photo = '0';
});
$('#reset122').addEventListener('click', () => { state.blur = 0; state.dim = 30; apply(); });
$('#recommend').addEventListener('click', () => { state.blur = 12; state.dim = 12; apply(); });
$('#fold').addEventListener('click', () => {
  const p = $('#panel');
  p.classList.toggle('collapsed');
  $('#fold').textContent = p.classList.contains('collapsed') ? '展开' : '收起';
});

// 地址参数：#blur=16&dim=10&theme=light
const q = new URLSearchParams(location.hash.slice(1));
if (q.has('blur')) state.blur = Math.min(48, Math.max(0, +q.get('blur')));
if (q.has('dim')) state.dim = Math.min(40, Math.max(0, +q.get('dim')));
if (q.has('theme')) state.theme = q.get('theme');

paintCards();
apply();
</script>
</body>
</html>
