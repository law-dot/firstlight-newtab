<!DOCTYPE html>
<html data-theme="dark" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>RSS 订阅 · 初见</title>
  <link href="assets/icons/128.png" rel="icon">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/rss.css" rel="stylesheet">
</head>
<body class="rss-page">
  <header class="rss-head">
    <a class="rss-back" href="newtab.html" title="返回主页">
      <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg>
      <span>返回</span>
    </a>
    <h1>RSS 订阅</h1>
    <div class="rss-actions">
      <button class="btn primary" id="addFeedBtn">添加源</button>
      <button class="btn" id="refreshBtn" title="忽略缓存强制刷新">刷新</button>
    </div>
  </header>

  <nav aria-label="订阅源筛选" class="chips" id="chips"></nav>
  <main class="entries" id="entries"></main>

  <dialog class="dlg" id="feedDialog">
    <form id="feedForm">
      <h3>添加订阅源</h3>
      <label>名称（可选）<input id="feedTitle" maxlength="40" placeholder="留空则自动获取"></label>
      <label>Feed 地址<input id="feedUrl" placeholder="https://example.com/feed.xml" required></label>
      <p class="dlg-hint">支持 RSS 2.0 / Atom。微博、B站、知乎等平台可通过 RSSHub 生成地址后粘贴到这里。</p>
      <div class="dlg-acts">
        <button class="btn" data-close type="button">取消</button>
        <button class="btn primary" type="submit">添加</button>
      </div>
    </form>
  </dialog>

  <script src="js/rss.js" type="module"></script>
</body>
</html>
